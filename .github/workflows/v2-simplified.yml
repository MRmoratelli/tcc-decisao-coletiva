name: V2 simplified flow validation
on:
  push:
    branches: [feat/v2-fluxo-simples-20261121]
    paths: ['prototype-v2/**', '.github/workflows/v2-simplified.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: prototype-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: prototype-v2/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
