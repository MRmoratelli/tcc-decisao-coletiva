name: Regras e interface

on:
  pull_request:
    branches: [matheus-dev, main]
  push:
    branches: ["codex/decisao-coletiva-*"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: decision_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d decision_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Regras, IA simulada e interface (SQLite)
        run: python -m unittest discover -s tests -v
        env:
          APP_TESTS_REQUIRED: "1"
          GEMINI_API_KEY: ""
      - name: Transações e regras (PostgreSQL)
        run: python -m unittest discover -s tests -p test_decision.py -v
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/decision_test
