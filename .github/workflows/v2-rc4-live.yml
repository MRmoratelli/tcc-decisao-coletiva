name: V2 RC4 decision progress live gate
on:
  push:
    branches: [validation/v2-rc4-20261121]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: prototype-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --import tsx server/rc4-live.ts
        env:
          FROZEN_COMMIT: 0b1d2ec424d5fe454882670c0aba5026625391ed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-rc4-synthetic-evidence
          path: prototype-v2/rc4-evidence
          retention-days: 30
