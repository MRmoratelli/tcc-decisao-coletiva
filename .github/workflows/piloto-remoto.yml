name: Piloto técnico no site publicado

on:
  push:
    branches: ["codex/piloto-remoto-*"]

permissions:
  contents: read

jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Preparar Chromium
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Verificar aplicação com participantes fictícios
        run: python tests/piloto_web.py
