name: V2 ten-person synthetic live gate
on:
  push:
    branches: [validation/v2-simple-20261121]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prototype-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --import tsx server/simple-live.ts
        env:
          FROZEN_COMMIT: 516fe216935dbbb930041011444c994323b0d532
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-simple-ten-synthetic-evidence
          path: prototype-v2/simple-evidence
          retention-days: 30
