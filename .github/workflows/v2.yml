name: V2 React and consensus API
on:
  push:
    branches: [feat/vite-typescript-decisao-generica]
    paths: ['prototype-v2/**', '.github/workflows/v2.yml']
  pull_request:
    branches: [feat/vite-typescript-decisao-generica]
    paths: ['prototype-v2/**', '.github/workflows/v2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-v2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: prototype-v2/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
